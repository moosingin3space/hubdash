# Minimal subset of the GitHub GraphQL schema covering the queries used by hubdash.
# Full schema: https://docs.github.com/en/graphql/overview/public-schema

schema {
  query: Query
}

type Query {
  viewer: User!
  repository(owner: String!, name: String!): Repository
}

type User {
  repositories(
    first: Int!
    ownerAffiliations: [RepositoryAffiliation!]!
    orderBy: RepositoryOrder!
  ): RepositoryConnection!
}

enum RepositoryAffiliation {
  OWNER
  COLLABORATOR
  ORGANIZATION_MEMBER
}

input RepositoryOrder {
  field: RepositoryOrderField!
  direction: OrderDirection!
}

enum RepositoryOrderField {
  PUSHED_AT
  UPDATED_AT
  CREATED_AT
  NAME
  STARGAZERS
}

enum OrderDirection {
  ASC
  DESC
}

type RepositoryConnection {
  nodes: [Repository!]!
}

type Repository {
  databaseId: Int
  name: String!
  owner: RepositoryOwner!
  description: String
  isPrivate: Boolean!
  url: String!
  isFork: Boolean!
  defaultBranchRef: Ref
  pullRequests(
    first: Int!
    states: [PullRequestState!]
    orderBy: IssueOrder
  ): PullRequestConnection!
}

type RepositoryOwner {
  login: String!
}

type Ref {
  target: GitObject
}

interface GitObject {
  id: ID!
}

type Commit implements GitObject {
  id: ID!
  statusCheckRollup: StatusCheckRollup
}

type StatusCheckRollup {
  state: StatusState!
}

enum StatusState {
  ERROR
  EXPECTED
  FAILURE
  PENDING
  SUCCESS
}

type PullRequestConnection {
  nodes: [PullRequest!]!
}

type PullRequest {
  number: Int!
  title: String!
  url: String!
  headRef: Ref
}

enum PullRequestState {
  OPEN
  CLOSED
  MERGED
}

input IssueOrder {
  field: IssueOrderField!
  direction: OrderDirection!
}

enum IssueOrderField {
  CREATED_AT
  UPDATED_AT
  COMMENTS
}
