[package]
name = "hubdash"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[bin]]
name = "hubdash"

[dependencies]
axum = { version = "0.8.8", default-features = false, features = ["http1", "http2"] }
tokio = { version = "1.49.0", optional = true, features = ["full"] }
clap = { version = "4.5.20", optional = true, features = ["derive", "env"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
maud = { version = "0.27.0", features = ["axum"] }
jiff = "0.2.18"
bitflags = "2.10.0"
url = "2.5.8"
http = "1.4.0"
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1.19", optional = true, features = ["client", "client-pool", "client-legacy", "tokio"] }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
jsonwebtoken = { version = "10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dotenv = { version = "0.15.0", optional = true }
hyper-rustls = { version = "0.27.7", optional = true, features = ["http2"] }

[dev-dependencies]
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.8"

[features]
default = ["tokio"]
tokio = ["dep:tokio", "axum/tokio", "dep:clap", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:dotenv", "dep:hyper-rustls", "jsonwebtoken/rust_crypto"]
