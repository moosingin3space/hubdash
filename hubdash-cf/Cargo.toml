[package]
name = "hubdash-cf"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.7.0"
console_error_panic_hook = "0.1.7"
http = "1.4.0"
http-body = "1.0.1"
http-body-util = "0.1"
hubdash = { version = "0.1.0", path = "../hubdash", default-features = false }
tower-service = "0.3.3"
worker = { version = "0.7.5", features = ["http", "axum"] }
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "js"] }

[lints]
workspace = true
