name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: ["**"]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        uses: moosingin3space/charmd-stack-ci/.github/workflows/dagger-call.yml@bef8189fc03988d92acfd55d338e2dc5a66f9ab8 # v1.2.1
        with:
            dagger-version: "0.20.3"
            call: lint
        secrets:
            dagger-cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

    test:
        needs: lint
        uses: moosingin3space/charmd-stack-ci/.github/workflows/dagger-call.yml@bef8189fc03988d92acfd55d338e2dc5a66f9ab8 # v1.2.1
        with:
            dagger-version: "0.20.3"
            call: test
        secrets:
            dagger-cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

    test-cf:
        needs: test
        uses: moosingin3space/charmd-stack-ci/.github/workflows/dagger-call.yml@bef8189fc03988d92acfd55d338e2dc5a66f9ab8 # v1.2.1
        with:
            dagger-version: "0.20.3"
            call: cf-worker-test
        secrets:
            dagger-cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

    deploy-preview:
        name: Deploy Preview Worker
        needs: test-cf
        if: github.event_name == 'pull_request'
        uses: moosingin3space/charmd-stack-ci/.github/workflows/dagger-call.yml@bef8189fc03988d92acfd55d338e2dc5a66f9ab8 # v1.2.1
        with:
            dagger-version: "0.20.3"
            environment: preview
            call: deploy-cf-worker --pr-number=${{ github.event.pull_request.number }} --cloudflare-api-token=env:CLOUDFLARE_API_TOKEN --cloudflare-account-id=env:CLOUDFLARE_ACCOUNT_ID
        secrets:
            dagger-cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
            cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    deploy-cf:
        name: Deploy Cloudflare Worker
        needs: test-cf
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: moosingin3space/charmd-stack-ci/.github/workflows/dagger-call.yml@bef8189fc03988d92acfd55d338e2dc5a66f9ab8 # v1.2.1
        with:
            dagger-version: "0.20.3"
            environment: production
            call: deploy-cf-worker --cloudflare-api-token=env:CLOUDFLARE_API_TOKEN --cloudflare-account-id=env:CLOUDFLARE_ACCOUNT_ID
        secrets:
            dagger-cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
            cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
