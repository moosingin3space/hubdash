# bacon.toml — local development job runner
#
# Hot-reload workflow:
#   systemfd --no-pid -s http::3000 -- bacon serve
#
# systemfd holds the TCP socket open across recompiles. The hubdash binary
# picks it up via listenfd (LISTEN_FDS), so new builds take over
# immediately without port conflicts.
#
# Plain check/test loop (no server):
#   bacon            # runs the default_job
#   bacon test

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--all-targets"]
need_stdout = false
default_watch = false
watch = ["hubdash/src", "hubdash-cf/src"]

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets"]
need_stdout = false
default_watch = false
watch = ["hubdash/src", "hubdash-cf/src"]

[jobs.test]
command = ["cargo", "test"]
need_stdout = true
default_watch = false
watch = ["hubdash/src", "hubdash-cf/src"]

[jobs.serve]
command = ["cargo", "run", "--bin", "hubdash"]
workdir = "hubdash"
need_stdout = true
on_change_strategy = "kill_then_restart"
